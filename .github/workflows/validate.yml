name: Validate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml colorama

      - name: Structural validation
        run: python scripts/validate-all.py

      - name: Deep validation
        run: python scripts/deep-validate.py

      - name: Verify catalog consistency
        run: |
          python -c "
          import json, os
          with open('skills_catalog.json') as f:
              data = json.load(f)
          total = data['metadata']['total_skills']
          domains = data['metadata']['domains']
          skills_count = len(data['skills'])
          print(f'Catalog: {skills_count} skills across {len(domains)} domains')
          assert skills_count == total, f'Mismatch: {skills_count} vs {total}'
          missing = []
          for s in data['skills']:
              p = f'.claude/skills/{s[\"category\"]}/{s[\"name\"]}/SKILL.md'
              if not os.path.exists(p):
                  missing.append(p)
          if missing:
              print(f'Missing {len(missing)}: {missing[:5]}')
              exit(1)
          print(f'All {skills_count} skills verified on disk')
          "

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
