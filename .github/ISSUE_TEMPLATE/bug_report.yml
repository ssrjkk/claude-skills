name: "🐛 Bug Report"
description: Report a skill content issue or SDK bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Check if this skill exists first: `claude-skills search <name>`

  - type: input
    id: skill
    attributes:
      label: "Skill name"
      description: "Which skill has the issue? (e.g. `api-testing`)"
      placeholder: "api-testing"

  - type: textarea
    id: description
    attributes:
      label: "What's wrong?"
      description: "Describe the issue — wrong code example, missing section, broken frontmatter..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What should the skill do instead?"
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: "Domain"
      options:
        - ai, ar-vr, backend, block, blockchain, ci-cd-setup, cloud, communications
        - data, database, database-migration, design, desktop
        - devops, ecommerce, education, embedded, energy, engineering
        - finance, frontend, gamedev, geospatial, healthcare, hr, iot
        - media, mobile, networking, os-admin, payments, product, qa
        - scientific, security, supply-chain, sustainability, test-reporting
        - Other / Not domain-specific
