<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Skills Library — Bilingual</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  --accent2: #bc8cff; --green: #3fb950; --yellow: #d29922;
  --red: #f85149; --ru-accent: #ff6b6b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.header { background: linear-gradient(180deg, #0d1117 0%, #161b22 100%); border-bottom: 1px solid var(--border); padding: 2.5rem 2rem; text-align: center; }
.header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; }
.header h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .subtitle { color: var(--muted); font-size: 1rem; margin-bottom: 1rem; }
.header .badge-row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem; }
.header .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.7rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
.header .badge-en { background: rgba(88,166,255,0.15); color: var(--accent); border: 1px solid rgba(88,166,255,0.3); }
.header .badge-ru { background: rgba(255,107,107,0.15); color: var(--ru-accent); border: 1px solid rgba(255,107,107,0.3); }
.stats { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
.stat { text-align: center; }
.stat-value { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

.controls { position: sticky; top: 0; z-index: 100; background: rgba(13,17,23,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; }
.control-row { max-width: 1200px; margin: 0 auto; }
.search-row { display: flex; gap: 0.75rem; align-items: center; }
.search-box { flex: 1; min-width: 200px; position: relative; }
.search-box input { width: 100%; padding: 0.6rem 0.8rem 0.6rem 2.2rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem; outline: none; }
.search-box input:focus { border-color: var(--accent); }
.search-box .icon { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.9rem; }
#resultCount { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
.lang-toggle { display: flex; gap: 0; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
.lang-btn { padding: 0.4rem 0.8rem; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.15s; }
.lang-btn-en { background: transparent; color: var(--muted); }
.lang-btn-ru { background: transparent; color: var(--muted); }
.lang-btn.active-en { background: var(--accent); color: #fff; }
.lang-btn.active-ru { background: var(--ru-accent); color: #fff; }
.filters { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
.filter-btn { padding: 0.25rem 0.75rem; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 0.8rem; transition: all 0.15s; }
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1.5rem; }
.skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0.75rem; }
.skill-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; cursor: pointer; transition: all 0.2s; }
.skill-card:hover { border-color: var(--accent); }
.skill-card .name-row { display: flex; align-items: center; gap: 0.4rem; }
.skill-card .name-row h3 { font-size: 0.9rem; font-family: 'SF Mono', 'Fira Code', monospace; }
.skill-card .ru-indicator { font-size: 0.6rem; padding: 0.1rem 0.35rem; border-radius: 3px; background: rgba(255,107,107,0.15); color: var(--ru-accent); border: 1px solid rgba(255,107,107,0.2); }
.skill-card .desc { font-size: 0.8rem; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 0.2rem; }
.skill-card .meta { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
.skill-card .cat-badge { font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.3px; background: rgba(88,166,255,0.1); color: var(--accent); border: 1px solid rgba(88,166,255,0.2); }
.skill-card .tags { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.skill-card .tag { font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 3px; background: rgba(139,148,158,0.1); color: var(--muted); }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: flex-start; padding: 2rem; overflow-y: auto; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 860px; width: 100%; margin: auto; padding: 2rem; position: relative; }
.modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; width: 2rem; height: 2rem; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.modal .lang-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.modal .lang-tab { padding: 0.5rem 1.2rem; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 0.85rem; font-weight: 600; border-bottom: 2px solid transparent; }
.modal .lang-tab.active-en { color: var(--accent); border-bottom-color: var(--accent); }
.modal .lang-tab.active-ru { color: var(--ru-accent); border-bottom-color: var(--ru-accent); }
.modal h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
.modal .meta-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; color: var(--muted); font-size: 0.85rem; }
.modal .body { color: var(--text); line-height: 1.7; font-size: 0.9rem; }
.modal .body h1 { font-size: 1.2rem; margin: 1.5rem 0 0.5rem; }
.modal .body h2 { font-size: 1.1rem; margin: 1.25rem 0 0.5rem; }
.modal .body h3 { font-size: 1rem; margin: 1rem 0 0.5rem; }
.modal .body p { margin: 0.5rem 0; }
.modal .body ul, .modal .body ol { margin: 0.5rem 0; padding-left: 1.5rem; }
.modal .body li { margin: 0.25rem 0; }
.modal .body code { background: rgba(88,166,255,0.1); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85em; color: var(--accent); }
.modal .body pre { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 1rem; overflow-x: auto; margin: 0.75rem 0; }
.modal .body pre code { background: none; padding: 0; color: inherit; }
.modal .body blockquote { border-left: 3px solid var(--accent2); padding-left: 1rem; margin: 1rem 0; color: var(--muted); }

.loading { text-align: center; padding: 3rem; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 0.75rem; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .header { padding: 2rem 1rem; }
  .header h1 { font-size: 1.6rem; }
  .controls { padding: 0.5rem 1rem; }
  .container { padding: 0 1rem; }
  .skills-grid { grid-template-columns: 1fr; }
  .modal { padding: 1.5rem; }
}
</style>
</head>
<body>
<header class="header">
  <h1><span>Claude Skills Library</span></h1>
  <div class="badge-row">
    <span class="badge badge-en">EN 10,000 skills</span>
    <span class="badge badge-ru">RU 10,000 навыков</span>
  </div>
  <p class="subtitle">Bilingual skill library — browse 10,000 skills in English and Russian</p>
  <div class="stats">
    <div class="stat"><div class="stat-value" id="totalSkills">—</div><div class="stat-label">Skills</div></div>
    <div class="stat"><div class="stat-value" id="totalDomains">—</div><div class="stat-label">Domains</div></div>
    <div class="stat"><div class="stat-value" id="totalBilingual">—</div><div class="stat-label">Bilingual (EN+RU)</div></div>
  </div>
</header>

<div class="controls">
  <div class="control-row">
    <div class="search-row">
      <div class="search-box">
        <span class="icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="Search skills / Поиск навыков..." autofocus>
      </div>
      <div class="lang-toggle" id="langToggle">
        <button class="lang-btn lang-btn-en active-en" data-lang="en" id="langEn">EN</button>
        <button class="lang-btn lang-btn-ru" data-lang="ru" id="langRu">RU</button>
      </div>
      <span id="resultCount"></span>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</div>

<div class="container">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading skills...</p>
  </div>
  <div class="skills-grid" id="skillsGrid" style="display:none"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="lang-tabs" id="modalLangTabs" style="display:none">
      <button class="lang-tab active-en" data-ml="en">English</button>
      <button class="lang-tab" data-ml="ru">Русский</button>
    </div>
    <div id="modalContent"></div>
    <div id="modalContentRu" style="display:none"></div>
  </div>
</div>

<script>
let skills = [];
let catalog = null;
let activeFilter = 'all';
let searchTerm = '';
let currentLang = 'en';
let currentSkillCat = '';
let currentSkillName = '';

async function init() {
  try {
    const res = await fetch('skills_catalog.json?' + Date.now());
    catalog = await res.json();
    skills = catalog.skills;
    document.getElementById('totalSkills').textContent = catalog.metadata.total_skills || skills.length;
    document.getElementById('totalDomains').textContent = catalog.metadata.domains.length;
    document.getElementById('totalBilingual').textContent = catalog.metadata.total_ru || '—';

    const filtersEl = document.getElementById('filters');
    let html = '<button class="filter-btn active" data-cat="all">All</button>';
    catalog.metadata.domains.forEach(d => {
      html += `<button class="filter-btn" data-cat="${d}">${d}</button>`;
    });
    filtersEl.innerHTML = html;

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchTerm = e.target.value.toLowerCase();
      render();
    });

    filtersEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.cat;
      render();
    });

    // Language toggle
    document.getElementById('langEn').addEventListener('click', () => setLang('en'));
    document.getElementById('langRu').addEventListener('click', () => setLang('ru'));

    document.getElementById('loading').style.display = 'none';
    document.getElementById('skillsGrid').style.display = 'grid';
    render();
  } catch(e) {
    document.getElementById('loading').innerHTML = `<p>Error: ${e.message}</p>`;
  }
}

function setLang(lang) {
  currentLang = lang;
  const en = document.getElementById('langEn');
  const ru = document.getElementById('langRu');
  en.className = 'lang-btn lang-btn-en' + (lang === 'en' ? ' active-en' : '');
  ru.className = 'lang-btn lang-btn-ru' + (lang === 'ru' ? ' active-ru' : '');
  render();
}

function render() {
  const filtered = skills.filter(s => {
    if (activeFilter !== 'all' && s.category !== activeFilter) return false;
    if (searchTerm) {
      return s.name.toLowerCase().includes(searchTerm) ||
             s.description.toLowerCase().includes(searchTerm) ||
             (Array.isArray(s.tags) && s.tags.some(t => typeof t === 'string' && t.toLowerCase().includes(searchTerm)));
    }
    return true;
  });

  document.getElementById('resultCount').textContent = `${filtered.length} / ${skills.length}`;
  const grid = document.getElementById('skillsGrid');
  grid.innerHTML = filtered.map(s => {
    const tags = Array.isArray(s.tags) ? s.tags.slice(0, 4) : [];
    const ruIndicator = s.has_ru ? '<span class="ru-indicator">RU</span>' : '';
    return `<div class="skill-card" onclick="showSkill('${s.category}', '${s.name}')">
      <div class="name-row"><h3>${s.name}</h3>${ruIndicator}</div>
      <div class="desc">${s.description}</div>
      <div class="meta">
        <span class="cat-badge">${s.category}</span>
        <div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

async function showSkill(category, name) {
  currentSkillCat = category;
  currentSkillName = name;
  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');
  const contentRu = document.getElementById('modalContentRu');
  modal.classList.add('open');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';
  contentRu.innerHTML = '';

  try {
    // Load EN
    const resEn = await fetch(`.claude/skills/${category}/${name}/SKILL.md?t=${Date.now()}`);
    let mdEn = await resEn.text();
    content.innerHTML = renderMarkdown(mdEn, name);

    // Check and load RU
    const resRu = await fetch(`.claude/skills/${category}/${name}/SKILL.ru.md?t=${Date.now()}`);
    if (resRu.ok) {
      let mdRu = await resRu.text();
      contentRu.innerHTML = renderMarkdown(mdRu, name);
      document.getElementById('modalLangTabs').style.display = 'flex';
      showModalLang('en');
    } else {
      document.getElementById('modalLangTabs').style.display = 'none';
    }
  } catch(e) {
    content.innerHTML = `<p>Error: ${e.message}</p>`;
  }
}

function showModalLang(lang) {
  const enContent = document.getElementById('modalContent');
  const ruContent = document.getElementById('modalContentRu');
  const tabs = document.querySelectorAll('.modal .lang-tab');
  if (lang === 'en') {
    enContent.style.display = 'block';
    ruContent.style.display = 'none';
    tabs[0].className = 'lang-tab active-en';
    tabs[1].className = 'lang-tab';
  } else {
    enContent.style.display = 'none';
    ruContent.style.display = 'block';
    tabs[0].className = 'lang-tab';
    tabs[1].className = 'lang-tab active-ru';
  }
}

function renderMarkdown(md, name) {
  let body = md;
  let meta = {};
  if (md.startsWith('---')) {
    const endIdx = md.indexOf('---', 3);
    if (endIdx > 0) {
      const fm = md.substring(3, endIdx).trim();
      body = md.substring(endIdx + 3).trim();
      fm.split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) meta[line.substring(0, idx).trim()] = line.substring(idx + 1).trim();
      });
    }
  }

  let html = `<h2>${name}</h2>`;
  html += `<div class="meta-row">`;
  if (meta.category) html += `<span><strong>Category:</strong> ${meta.category}</span>`;
  if (meta.language) html += `<span><strong>Language:</strong> ${meta.language === 'ru' ? 'Russian / Русский' : 'English'}</span>`;
  if (meta.models) html += `<span><strong>Models:</strong> ${meta.models}</span>`;
  if (meta.version) html += `<span><strong>Version:</strong> ${meta.version}</span>`;
  if (meta.original) html += `<span><strong>Original:</strong> ${meta.original}</span>`;
  html += `</div>`;

  // Simple markdown to HTML
  let bodyHtml = body
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^- \[ \] (.+)$/gm, '<li><input type="checkbox" disabled> $1</li>')
    .replace(/- (\*\*.+?\*\*:)/g, '<li><strong>$1</strong>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?)(?=\n\n|<[hH]|<li|<ol|<\/ul|$)/g, '<ul>$1</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  html += `<div class="body"><p>${bodyHtml}</p></div>`;
  return html;
}

// Modal lang tab listeners
document.getElementById('modalLangTabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.lang-tab');
  if (!tab) return;
  showModalLang(tab.dataset.ml);
});

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('open');
});
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) document.getElementById('modal').classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('modal').classList.remove('open');
});

init();
</script>
</body>
</html>
